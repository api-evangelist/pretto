aid: pretto
name: Pretto
description: 'Pretto is a French online mortgage brokerage (courtier en credit immobilier) operated
  by FINSPOT SAS, founded in 2016 and headquartered in Paris. It runs a digital platform that lets
  borrowers simulate a home loan, compare rates across more than 125 partner banks, assemble a
  financing file and be accompanied by a human credit expert through to signature, and it publishes
  a transparent, non-negotiable fee schedule instead of the bank-funded commission model used by
  most French brokers. Pretto also operates Pretto Galaxie, a B2B network that opens the same
  technology stack — semi-automated file assembly, an embeddable loan simulator, a client portal,
  a commission dashboard and a back-office service — to independent brokers, and Pretto Search, a
  consumer property-search product priced against real borrowing capacity. FINSPOT is registered
  with ORIAS (17000916) as a banking/payment-services and insurance broker and is supervised by the
  ACPR. As of this pass Pretto publishes no public developer program: the api.pretto.fr host serves
  its API reference behind HTTP Basic auth and the developers.pretto.fr ReadMe hub is deactivated.'
